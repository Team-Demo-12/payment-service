organization: Payments Platform
description: Beaconstone Payments — selects the card-network authorisation profile and processes payment authorisation.
computeClassification:
  dataType: [None]
links:
  healthcheck:
    uri: /health
  source:
    url: https://github.com/Team-Demo-12/payment-service
compose:
  microservice:
    image: ghcr.io/Team-Demo-12/payment-service
    tag: ${DOCKER_TAG}
    ports: [8080:8080]
buildNumber: ${DOCKER_TAG}
config:
  environmentVariables:
    SERVICE_NAME: payment-service
