services:
  payment-service:
    build: { context: ., dockerfile: Dockerfile }
    image: beaconstone/payment-service:local
    container_name: payment-service
    restart: unless-stopped
    ports: ["${HOST_PORT:-8080}:8080"]
    environment:
      PORT: 8080
      SERVICE_NAME: ${SERVICE_NAME:-payment-service}
      RELEASE: ${RELEASE:-payments-4.17.3}
      API_KEY: ${API_KEY:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
